# Compila l'app web e la pubblica su GitHub Pages a ogni push su Develop.
#
# Configurazione una tantum su GitHub:
#   1. Settings → Pages → Build and deployment → Source: "GitHub Actions".
#   2. Settings → Environments → github-pages → Deployment branches and
#      tags: aggiungi il ramo "Develop".
name: Pubblica su GitHub Pages

on:
  push:
    branches: [Develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una sola pubblicazione alla volta: vince la più recente.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Dipendenze
        run: flutter pub get

      - name: Codice generato (modelli e testi)
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Analisi e test
        run: |
          flutter analyze --no-fatal-infos
          flutter test

      # L'app vive in https://<utente>.github.io/<repository>/
      - name: Build web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      # GitHub Pages non conosce i percorsi interni dell'app (/storico,
      # /reimposta-password…): con 404.html uguale a index.html ogni
      # indirizzo apre comunque l'app, anche i link delle email.
      - name: Percorsi interni
        run: cp build/web/index.html build/web/404.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
