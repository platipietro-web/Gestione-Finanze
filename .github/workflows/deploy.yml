# Compila l'app web e la pubblica sul ramo gh-pages a ogni push su Develop.
#
# Configurazione una tantum su GitHub, dopo la prima esecuzione (che crea il
# ramo gh-pages): Settings → Pages → Build and deployment → Source: "Deploy
# from a branch", Branch: "gh-pages", cartella "/ (root)".
name: Deploy Flutter Web su GitHub Pages

on:
  push:
    branches: [Develop]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Dipendenze
        run: flutter pub get

      - name: Codice generato (modelli e testi)
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      # Se un test fallisce il sito non viene toccato.
      - name: Analisi e test
        run: |
          flutter analyze --no-fatal-infos
          flutter test

      - name: Build web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      # GitHub Pages risponde con 404.html ai percorsi che non esistono come
      # file (/storico, /accedi, i link delle email): così si apre l'app.
      - name: Percorsi interni
        run: cp build/web/index.html build/web/404.html

      # Crea anche .nojekyll, così GitHub pubblica i file così come sono.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          force_orphan: true
